name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev nlohmann-json3-dev zlib1g-dev dpkg-dev
      - name: Compilar, probar y empaquetar .deb
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xeldi-deb-ubuntu-24.04
          path: build-deb/*.deb

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencias
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base nlohmann-json zlib
      - uses: actions/checkout@v4
      - name: Compilar y probar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
